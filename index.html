<script>
// one page: play / pause, and an old-school demo (copper bars, starfield, sine scroller, spectrum) that moves with the music
const a = document.getElementById('a'), btn = document.getElementById('play'), ico = document.getElementById('ico');
const cv = document.getElementById('c'), g = cv.getContext('2d'), led = document.getElementById('led');
const fill = document.getElementById('fill'), timeEl = document.getElementById('time');
const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1, ac = null, an = null, bins = null, t0 = performance.now();
function size() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', size); size();
// the analyser: started from the first tap (iOS needs a user gesture); if anything fails, the demo runs on its own clock
// iPhones: Web Audio obeys the silent switch, so a phone on silent would play nothing. Newer iOS (16.4+) lets the page say
// "this is music" (audioSession 'playback'); older iOS skips the analyser and the demo dances on its own clock instead.
const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function audioGraph() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) {} }
  else if (iOS) { ac = { state: 'none' }; return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; ac = new AC();
    const src = ac.createMediaElementSource(a); an = ac.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.75;
    src.connect(an); an.connect(ac.destination); bins = new Uint8Array(an.frequencyBinCount);
  } catch (e) { an = null; }
}
function toggle() { audioGraph(); if (a.paused) a.play().catch(() => {}); else a.pause(); }
btn.addEventListener('click', e => { e.stopPropagation(); toggle(); });
cv.addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
a.addEventListener('play', () => { document.body.classList.add('playing'); btn.setAttribute('aria-label', 'Pause'); ico.innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'; });
a.addEventListener('pause', () => { document.body.classList.remove('playing'); btn.setAttribute('aria-label', 'Play'); ico.innerHTML = '<path d="M8 5v14l11-7z"/>'; });
a.addEventListener('ended', () => { a.currentTime = 0; });
const mmss = s => (s / 60 | 0) + ':' + String(s % 60 | 0).padStart(2, '0');
a.addEventListener('timeupdate', () => { const d = a.duration || 173; fill.style.width = (100 * a.currentTime / d) + '%'; timeEl.textContent = mmss(a.currentTime) + ' / ' + mmss(d); });
document.getElementById('bar').addEventListener('click', e => { e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(); if (a.duration) a.currentTime = a.duration * (e.clientX - r.left) / r.width; });
// stars
const N = calm ? 60 : 180, stars = Array.from({ length: N }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() }));
const text = '   ***  ZUPAKOLLIDA PRESENTS  ***  MAYAFE  ***  A LIVE TAKE  ***  SUPERCOLLIDER x KO II x MINILAB 3  ***  KICKS FROM THE EP-133, BASS FROM A MOOG LADDER, KEYS FROM A PROPHET-5  ***  GREETINGS TO EVERYONE LISTENING ON A PHONE  ***  PRESS PLAY, TURN IT UP   ';
const preview = location.search.includes('preview');   // screenshots: run the demo as if playing
function frame(now) {
  const t = (now - t0) / 1000, playing = !a.paused || preview;
  let bass = 0, mid = 0, high = 0;
  if (an && playing) { an.getByteFrequencyData(bins); for (let i = 0; i < bins.length; i++) { const v = bins[i] / 255; if (i < 6) bass += v / 6; else if (i < 40) mid += v / 34; else high += v / (bins.length - 40); } }
  else if (playing) { bass = 0.5 + 0.5 * Math.max(0, Math.sin(t * 13)); mid = 0.4 + 0.3 * Math.sin(t * 3); high = 0.3 + 0.2 * Math.sin(t * 7); }
  const sp = playing ? 1 : 0.15;
  // copper (raster) bars
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const nb = calm ? 3 : 6;
  for (let b = 0; b < nb; b++) {
    const y = H * (0.5 + 0.38 * Math.sin(t * sp * (0.9 + b * 0.17) + b * 1.3)), h = 26 + 40 * bass;
    const hue = (20 + b * 40 + t * 20 * sp) % 360, gr = g.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    gr.addColorStop(0, `hsla(${hue},90%,10%,0)`); gr.addColorStop(0.5, `hsla(${hue},95%,${45 + 20 * mid}%,0.85)`); gr.addColorStop(1, `hsla(${hue},90%,10%,0)`);
    g.fillStyle = gr; g.fillRect(0, y - h / 2, W, h);
  }
  // starfield, rushing faster on the bass
  const cx = W / 2, cy = H / 2, sc = Math.max(W, H) * 0.6;
  for (const s of stars) {
    s.z -= (0.002 + 0.02 * bass) * sp * (calm ? 0.4 : 1); if (s.z <= 0.02) { s.z = 1; s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; }
    const X = cx + s.x / s.z * sc * 0.5, Y = cy + s.y / s.z * sc * 0.5, r = (1 - s.z) * 3;
    if (X < 0 || X > W || Y < 0 || Y > H) continue;
    g.fillStyle = `rgba(255,255,255,${1 - s.z})`; g.fillRect(X, Y, r, r);
  }
  // spectrum: chunky bars along the bottom
  const nbars = 32, bw = W / nbars, base = H - 70;
  for (let i = 0; i < nbars; i++) {
    let v = an && playing ? bins[Math.min(bins.length - 1, Math.floor(i * bins.length / nbars * 0.7))] / 255 : (playing ? 0.3 + 0.3 * Math.sin(t * 6 + i * 0.6) * Math.sin(t * 2.3 + i) : 0.03);
    const h = Math.max(2, v * H * 0.22), seg = 6;
    for (let y = 0; y < h; y += seg) { g.fillStyle = y > H * 0.15 ? '#ff3b30' : (y > H * 0.08 ? '#f2c12b' : '#8cd99a'); g.fillRect(i * bw + 2, base - y - seg + 1, bw - 4, seg - 2); }
  }
  // sine scroller
  const fs = Math.max(18, Math.min(34, W / 18)); g.font = `bold ${fs}px Menlo, monospace`; g.textBaseline = 'middle';
  const cw = fs * 0.62, total = text.length * cw, off = (t * (playing ? 120 : 30)) % total, ys = H * 0.72;
  for (let i = 0; i < text.length; i++) {
    const x = i * cw - off; const xx = x < -cw ? x + total : x; if (xx > W + cw) continue;
    const y = ys + Math.sin(xx * 0.012 + t * 3) * (12 + 22 * mid);
    g.fillStyle = `hsl(${(xx * 0.4 + t * 90) % 360},95%,62%)`; g.fillText(text[i], xx, y);
  }
  // the LED title pumps on the bass
  led.style.transform = `scale(${1 + 0.06 * bass * (playing ? 1 : 0)})`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
